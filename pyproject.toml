[project]
name = "a-starter-kit"
version = "0.1.0"
description = "Streamlit starter template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
